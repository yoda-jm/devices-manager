name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean compile -DskipTests

    - name: Compile tests
      run: mvn test-compile

    - name: Run tests
      run: mvn test

    - name: Package JARs
      run: mvn package -DskipTests

    - name: Upload JAR artifacts
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: application-jars
        path: |
          services/statistics-api/target/*.jar
          services/device-registration-api/target/*.jar
          services/device-viewer/target/*.jar
        retention-days: 1

    - name: Generate test report
      if: always()
      uses: dorny/test-reporter@dc3a92680fcc15842eef52e8c4606ea7ce6bd3f3 # this is 2.1.1
      with:
        name: Maven Tests
        path: '**/target/surefire-reports/TEST-*.xml'
        reporter: java-junit
        fail-on-error: true
