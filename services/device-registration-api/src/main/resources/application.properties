server.port=8081
spring.application.name=device-registration-api

# Actuator security: only expose health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JPA/Hibernate configuration - Flyway manages schema, not Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway configuration - uses separate user with full schema management rights
# Application datasource uses registration_user (read/write only)
# Flyway uses flyway_user (full DDL rights for migrations)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.user=${SPRING_FLYWAY_USER}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD}
